workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - deploy-check

test:
  stage: test
  tags: [secloud]
  image: logru/format-validator-deps:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync --frozen --extra dev
    - uv run pytest

deploy-check:
  stage: deploy-check
  tags: [secloud]
  image: docker:27
  script:
    - docker compose up -d --build
    - >
      for i in $(seq 1 10); do
        docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" 2>/dev/null && break
        echo "api not ready yet, retrying..."
        sleep 2
      done
    - docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
    - docker compose exec -T ontology wget -S -O /dev/null http://localhost/edam_eo.owl
    - docker compose logs
    - docker compose down
