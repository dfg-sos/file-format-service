services:
  api:
    image: ghcr.io/dfg-sos/file-format-service:latest
    ports:
      - "8000:8000"
    platform: linux/amd64
    # environment:
      # Worker processes; validation also runs in a thread pool per worker.
    #   WEB_CONCURRENCY: 4
      # Validate files on the host in place via /api/v1/validate/{structural,full}/local:
      # mount the host directory read-only and map host path -> mount point.
      # Clients then send host paths like /home/user/data/run42/out.shp.
    #   SOS_FFS_SHARED_DIRS: ${PWD}/tmp/:/data
    # volumes:
    #   - ${PWD}/tmp/:/data:ro
      # Format mappings (*.json), one per ontology namespace. None are shipped,
      # validation needs at least one.
    #   - ${PWD}/mappings/:/app/mappings:ro
      # Use local ontologies in /api/v1/compatibility and /api/v1/format-info:
      # mount them read-only and reference them by their path in the container,
      # e.g. "ontology_schema_url": "file:///ontology/my-formats.owl".
    #   - ${PWD}/ontology/:/ontology:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
